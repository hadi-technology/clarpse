name: Java CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: 17
            node-version: 18
          - java-version: 17
            node-version: 20
          - java-version: 17
            node-version: 22
          - java-version: 21
            node-version: 20
          - java-version: 25
            node-version: 20

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'microsoft'
          cache: 'maven'
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install TypeScript
        run: npm install -g typescript
      - name: "Run tests and package"
        run: "mvn clean package assembly:single"
      - name: Build Docker image
        if: matrix.java-version == '17' && matrix.node-version == '20'
        run: docker build -t clarpse-api .
      - name: Run Docker smoke test
        if: matrix.java-version == '17' && matrix.node-version == '20'
        run: |
          set -euo pipefail
          docker run -d --name clarpse-api -p 8080:8080 clarpse-api
          trap 'docker rm -f clarpse-api' EXIT
          until curl -fs http://localhost:8080/health > /dev/null; do
            sleep 1
          done
          RESPONSE=""
          set +e
          RESPONSE=$(curl -sS -X POST http://localhost:8080/parse \
            -H "Content-Type: application/json" \
            -d '{"language":"java","files":[{"path":"src/Foo.java","content":"package test; class Foo { void m() {} }"}]}')
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "Parse request failed with HTTP status $STATUS"
            echo "$RESPONSE"
            docker logs clarpse-api
            exit 1
          fi
          echo "$RESPONSE" | grep -q "\"components\""
      - name: Upload coverage reports to Codecov
        if: matrix.java-version == '17' && matrix.node-version == '20'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    env:
      CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17 for publishing
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: 'maven'
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cp settings.xml ~/.m2/settings.xml
      - name: Import GPG key
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY is empty. Check your repo secrets." >&2
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | tr -d '\r' > /tmp/gpg.key
          if ! grep -q "BEGIN PGP" /tmp/gpg.key; then
            printf '%b' "$GPG_PRIVATE_KEY" | tr -d '\r' > /tmp/gpg.key
          fi
          if gpg --batch --import /tmp/gpg.key; then
            echo "Imported armored GPG key."
          else
            echo "Armored import failed, trying base64 decode."
            base64 --decode /tmp/gpg.key > /tmp/gpg.bin
            gpg --batch --import /tmp/gpg.bin
          fi
      - name: Resolve GPG key id
        run: |
          if [ -z "$GPG_KEYNAME" ]; then
            GPG_KEYNAME=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          fi
          if [ -z "$GPG_KEYNAME" ]; then
            echo "Unable to determine GPG key id." >&2
            exit 1
          fi
          echo "GPG_KEYNAME=$GPG_KEYNAME" >> $GITHUB_ENV
      - name: Deploy to Maven Central
        run: mvn -P release -DskipTests -Dgpg.keyname="$GPG_KEYNAME" -Dgpg.passphrase="$GPG_PASSPHRASE" deploy
